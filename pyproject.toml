[project]
name = "collaborate"
version = "0.1.0"
description = "Git-based checkout manager for Adobe Premiere Pro projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
menubar = [
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.scripts]
collab = "collaborate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collaborate"]
